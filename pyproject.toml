[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "quant-engine"
version = "0.1.0"
description = "Research and execution engine for intraday index and index-option strategies on Indian markets"
readme = "README.md"
license = "MIT"
authors = [{ name = "Vijay Krishna Reddy Muddasani" }]
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
]

[project.optional-dependencies]
kite = ["kiteconnect>=5.0"]
parquet = ["pyarrow>=15"]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.10",
    "pandas-stubs>=2.2",
]

[project.scripts]
qe-backtest = "quant_engine.cli:backtest_main"
qe-bot = "quant_engine.ops.bot:main"
qe-guard = "quant_engine.ops.guard:main"
qe-leak-guard = "quant_engine.devtools.leak_guard:main"
qe-live = "quant_engine.ops.live_book:main"

[tool.hatch.build.targets.wheel]
packages = ["src/quant_engine"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "N", "RUF", "PT"]
# Exceptions are named for the outcome they report (OrderRejected, OutcomeUnknown,
# ExecutionHalted); an "Error" suffix would add nothing.
ignore = ["N818"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers"

[tool.mypy]
python_version = "3.11"
files = ["src"]
disallow_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
warn_return_any = true
ignore_missing_imports = true
